services:
  - type: web
    name: synapse-ml
    env: python
    buildCommand: "cd student-clustering/frontend && npm install && npm run build && cd ../.. && pip install -r student-clustering/requirements.txt"
    startCommand: "cd student-clustering && uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
